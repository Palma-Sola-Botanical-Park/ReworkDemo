<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 490" role="img">
  <title>Feed pipeline: four places the data exists, with agents that move it</title>
  <desc>A vertical spine of four boxes shows where the data rests: Google Sheet, staging JSON, published JSON, and the browser. Off to the right, pill-shaped agents (two Python scripts and a YAML scheduler) are the machinery that moves and schedules the data between those four resting places. Solid arrows trace the data's path; dashed lines show which agent performs or triggers each hop.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .lbl { fill: #5F5E5A; }
    .arr { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
    .arrhead { stroke: #5F5E5A; }
    .dot { fill: #5F5E5A; }
    .leader { stroke: #888780; stroke-width: 0.8; stroke-dasharray: 4 3; fill: none; }

    .green rect { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.8; }
    .green .th { fill: #27500A; } .green .ts { fill: #3B6D11; }
    .blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.8; }
    .blue .th { fill: #0C447C; } .blue .ts { fill: #185FA5; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1.5; }
    .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
    .amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.8; }
    .amber .th { fill: #633806; } .amber .ts { fill: #854F0B; }

    @media (prefers-color-scheme: dark) {
      .lbl { fill: #9c9a92; }
      .arr { stroke: #9c9a92; } .arrhead { stroke: #9c9a92; } .dot { fill: #9c9a92; }
      .leader { stroke: #73726c; }
      .green rect { fill: #27500A; stroke: #97C459; }
      .green .th { fill: #C0DD97; } .green .ts { fill: #97C459; }
      .blue rect { fill: #0C447C; stroke: #85B7EB; }
      .blue .th { fill: #B5D4F4; } .blue .ts { fill: #85B7EB; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple .th { fill: #CECBF6; } .purple .ts { fill: #AFA9EC; }
      .amber rect { fill: #633806; stroke: #EF9F27; }
      .amber .th { fill: #FAC775; } .amber .ts { fill: #EF9F27; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrhead" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="ts lbl" x="40" y="74">in the sheet</text>
  <text class="ts lbl" x="40" y="184">in staging</text>
  <text class="ts lbl" x="40" y="294">in published</text>
  <text class="ts lbl" x="40" y="404">in the browser</text>

  <g class="green">
    <rect x="160" y="50" width="180" height="56" rx="8"/>
    <text class="th" x="250" y="72" text-anchor="middle" dominant-baseline="central">Google Sheet</text>
    <text class="ts" x="250" y="90" text-anchor="middle" dominant-baseline="central">Bev edits</text>
  </g>
  <g class="blue">
    <rect x="160" y="160" width="180" height="56" rx="8"/>
    <text class="th" x="250" y="182" text-anchor="middle" dominant-baseline="central">data/staging/</text>
    <text class="ts" x="250" y="200" text-anchor="middle" dominant-baseline="central">raw dump, no checks</text>
  </g>
  <g class="blue">
    <rect x="160" y="270" width="180" height="56" rx="8"/>
    <text class="th" x="250" y="292" text-anchor="middle" dominant-baseline="central">data/published/</text>
    <text class="ts" x="250" y="310" text-anchor="middle" dominant-baseline="central">validated · gated</text>
  </g>
  <g class="purple">
    <rect x="160" y="380" width="180" height="56" rx="8"/>
    <text class="th" x="250" y="402" text-anchor="middle" dominant-baseline="central">Browser</text>
    <text class="ts" x="250" y="420" text-anchor="middle" dominant-baseline="central">the final step</text>
  </g>

  <line x1="250" y1="108" x2="250" y2="158" class="arr" marker-end="url(#arrow)"/>
  <line x1="250" y1="218" x2="250" y2="268" class="arr" marker-end="url(#arrow)"/>
  <line x1="250" y1="328" x2="250" y2="378" class="arr" marker-end="url(#arrow)"/>

  <g class="amber">
    <rect x="400" y="40" width="210" height="44" rx="22"/>
    <text class="th" x="505" y="54" text-anchor="middle" dominant-baseline="central">sync-sheet.yml</text>
    <text class="ts" x="505" y="72" text-anchor="middle" dominant-baseline="central">scheduler · cron + button</text>
  </g>
  <g class="amber">
    <rect x="400" y="111" width="210" height="44" rx="22"/>
    <text class="th" x="505" y="125" text-anchor="middle" dominant-baseline="central">fetch_sheets.py</text>
    <text class="ts" x="505" y="143" text-anchor="middle" dominant-baseline="central">pulls CSV → staging</text>
  </g>
  <g class="amber">
    <rect x="400" y="221" width="210" height="44" rx="22"/>
    <text class="th" x="505" y="235" text-anchor="middle" dominant-baseline="central">validate_promote.py</text>
    <text class="ts" x="505" y="253" text-anchor="middle" dominant-baseline="central">validates · gates</text>
  </g>

  <circle class="dot" cx="250" cy="133" r="2.5"/>
  <line x1="254" y1="133" x2="398" y2="133" class="leader"/>
  <circle class="dot" cx="250" cy="243" r="2.5"/>
  <line x1="254" y1="243" x2="398" y2="243" class="leader"/>

  <path d="M610 62 L630 62 L630 243" class="leader"/>
  <line x1="630" y1="133" x2="612" y2="133" class="leader"/>
  <line x1="630" y1="243" x2="612" y2="243" class="leader"/>
  <text class="ts lbl" x="638" y="190" text-anchor="end">fires both</text>

  <text class="ts lbl" x="40" y="462">Boxes = where the data rests (4 places) · pills = agents that move &amp; schedule it</text>
  <text class="ts lbl" x="40" y="480">Solid arrow = data's path · dashed = which agent performs / triggers the hop</text>
</svg>
