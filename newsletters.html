<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletters · Palma Sola Botanical Park</title>
<link rel="stylesheet" href="css/site.css">
<style>
.nl-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.25rem;
  margin-top: 2rem;
}
.nl-card {
  background: var(--white);
  border-radius: 10px;
  padding: 1.4rem 1.5rem;
  box-shadow: 0 2px 10px rgba(0,0,0,.07);
  border-top: 4px solid var(--green-mid);
  display: flex;
  flex-direction: column;
  gap: .6rem;
}
.nl-date {
  font-size: .75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--gold);
}
.nl-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  color: var(--green-deep);
  line-height: 1.3;
}
.nl-desc {
  font-size: .9rem;
  color: var(--text-soft);
  line-height: 1.6;
  flex: 1;
}
.nl-read {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  font-size: .85rem;
  font-weight: 700;
  color: var(--green-mid);
  text-decoration: none;
  margin-top: .25rem;
}
.nl-read:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page-hero" style="min-height:280px">
  <div class="page-hero-bg" style="background-image:url('images/Wax_Myrtle.jpg')"></div>
  <div class="page-hero-content" style="text-align:center;margin:0 auto">
    <div class="label label-light">Stay Connected</div>
    <h1>Newsletters</h1>
    <p>What's blooming, what's been planted, what's coming up — straight from the park.</p>
  </div>
</div>

<section class="bg-cream">
  <div class="section-inner">
    <span class="label">Archive</span>
    <h2 class="section-title">All newsletters</h2>
    <p class="section-sub">Most recent first. Each one opens in our document viewer so you never leave the site.</p>

    <div class="nl-grid" id="nlGrid">
      <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-soft)">Loading newsletters…</div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/site.js"></script>
<script>
injectShared({ inatBar: false });

// Newsletter tab GID — add this tab to the Google Sheet
// Columns (row 1 = section title, row 2 = headers, row 3 = notes, row 4+ = data):
//   date | title | description | pdf_url | display
const NL_GID = 1897432156; // ← UPDATE THIS after Bev creates the tab

async function loadNewsletters() {
  const grid = document.getElementById('nlGrid');
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${NL_GID}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('Sheet fetch failed');
    const text = await resp.text();
    const lines = text.trim().split('\n');
    const headers = parseCSVLine(lines[1]).map(h => h.trim().toLowerCase().replace(/\s+/g,'_'));
    const rows = lines.slice(3)
      .map(line => {
        const vals = parseCSVLine(line);
        const obj = {};
        headers.forEach((h,i) => obj[h] = (vals[i]||'').trim());
        return obj;
      })
      .filter(r => Object.values(r).some(v => v))
      .filter(r => isWebVisible(r))
      // Most recent first
      .sort((a,b) => new Date(b.date||0) - new Date(a.date||0));

    if (!rows.length) {
      grid.innerHTML = '<p class="text-soft" style="grid-column:1/-1;text-align:center;padding:2rem">No newsletters available yet. Check back soon.</p>';
      return;
    }

    grid.innerHTML = rows.map(nl => {
      const d = nl.date ? new Date(nl.date+'T12:00') : null;
      const dateStr = d ? d.toLocaleDateString('en-US',{month:'long',year:'numeric'}) : '';
      // All PDFs open in viewer.html — keeps users on site
      const readHref = nl.pdf_url
        ? `viewer.html?url=${encodeURIComponent(nl.pdf_url)}&title=${encodeURIComponent(nl.title)}&back=newsletters.html`
        : '#';
      return `<div class="nl-card">
        ${dateStr ? `<div class="nl-date">${dateStr}</div>` : ''}
        <div class="nl-title">${nl.title||'Newsletter'}</div>
        ${nl.description ? `<div class="nl-desc">${nl.description}</div>` : ''}
        ${nl.pdf_url ? `<a class="nl-read" href="${readHref}">📄 Read →</a>` : ''}
      </div>`;
    }).join('');

  } catch(e) {
    grid.innerHTML = '<p class="text-soft" style="grid-column:1/-1;text-align:center;padding:2rem">Could not load newsletters. Please try again later.</p>';
    console.warn('Newsletter load error:', e);
  }
}

loadNewsletters();
</script>
</body>
</html>
