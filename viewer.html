<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Viewer · Palma Sola Botanical Park</title>
<link rel="stylesheet" href="css/site.css">
<style>
.viewer-wrap {
  max-width: 1000px;
  margin: 2rem auto;
  padding: 0 1.5rem 4rem;
}
.viewer-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  padding: 1rem 0 1.25rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}
.viewer-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem;
  color: var(--green-deep);
}
.viewer-back {
  font-size: .88rem;
  font-weight: 700;
  color: var(--green-mid);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: .4rem;
}
.viewer-back:hover { text-decoration: underline; }
.viewer-frame {
  width: 100%;
  height: 82vh;
  min-height: 500px;
  border: none;
  border-radius: 10px;
  box-shadow: 0 4px 24px rgba(0,0,0,.12);
  display: block;
}
.viewer-fallback {
  display: none;
  background: var(--sand);
  border-radius: 10px;
  padding: 3rem 2rem;
  text-align: center;
}
.viewer-fallback p {
  color: var(--text-soft);
  margin-bottom: 1.5rem;
  font-size: 1rem;
  line-height: 1.7;
}
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="viewer-wrap">
  <div class="viewer-topbar">
    <a class="viewer-back" id="backLink" href="javascript:history.back()">← Back</a>
    <div class="viewer-title" id="viewerTitle">Document</div>
    <a class="btn btn-green btn-sm" id="downloadLink" href="#" target="_blank" rel="noopener">⬇ Open in new tab</a>
  </div>

  <iframe class="viewer-frame" id="viewerFrame" title="Document viewer"></iframe>

  <div class="viewer-fallback" id="viewerFallback">
    <p>Your browser couldn't display this document inline.<br>Use the button above to open it directly.</p>
  </div>
</div>

<div id="footer-placeholder"></div>
<script src="js/site.js"></script>
<script>
injectShared({ inatBar: false });

// Read ?url= and ?title= from the query string
const params  = new URLSearchParams(window.location.search);
const pdfUrl  = params.get('url')  || '';
const title   = params.get('title') || 'Document';
const back    = params.get('back')  || '';

// Set title
document.title = title + ' · Palma Sola Botanical Park';
document.getElementById('viewerTitle').textContent = title;

// Set download link
const dlLink = document.getElementById('downloadLink');
dlLink.href = pdfUrl;

// Optional explicit back link
if (back) document.getElementById('backLink').href = back;

// Load into iframe
if (pdfUrl) {
  const frame = document.getElementById('viewerFrame');
  frame.src = pdfUrl;
  frame.onerror = () => {
    frame.style.display = 'none';
    document.getElementById('viewerFallback').style.display = 'block';
  };
} else {
  document.getElementById('viewerFrame').style.display = 'none';
  document.getElementById('viewerFallback').style.display = 'block';
  document.getElementById('viewerFallback').querySelector('p').textContent =
    'No document URL was provided.';
}
</script>
</body>
</html>
